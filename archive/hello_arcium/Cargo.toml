[package]
name = "hello_arcium"
version = "0.1.0"
description = "Smallest real Arcium computation, used to prove the pipeline"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "hello_arcium"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "arcium-anchor/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "=1.0.2", features = ["init-if-needed"] }
arcium-client = { default-features = false, version = "=0.14.1" }
arcium-macros = "=0.14.1"
arcium-anchor = "=0.14.1"
pyth-solana-receiver-sdk = "2.0.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
