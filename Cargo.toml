[workspace]
# `archive/` is deliberately NOT a member. See archive/hello_arcium/README.md:
# it drives circuits that were superseded by the _v2/_v3 versions, so it no
# longer compiles, and while it was a workspace member that broke `arcium build`
# for the entire repository rather than just for itself.
members = ["programs/*", "encrypted-ixs"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.89.0"

[profile.release]
# Non-negotiable: silent wraparound in a custody program is a fund-loss bug.
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
